<div class="flex min-h-screen items-center justify-center bg-white px-4">
  <div class="w-full max-w-sm">
    <div class="mb-8 flex flex-col items-center text-center">
      <app-logo size="lg" />
      <p class="mt-3 text-lg text-sand-600">Panel de administración</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="card flex flex-col gap-4">
      <label class="field-label">
        Email
        <input
          type="email"
          formControlName="email"
          autocomplete="username"
          class="field-input"
        />
      </label>
      <label class="field-label">
        Contraseña
        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
          class="field-input"
        />
      </label>

      @if (error()) {
        <p class="text-sm font-medium text-rose-600">{{ error() }}</p>
      }

      <button type="submit" [disabled]="form.invalid || loading()" class="btn-primary mt-2">
        {{ loading() ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>
