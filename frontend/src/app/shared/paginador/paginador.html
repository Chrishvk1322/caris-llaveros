<div class="mt-4 flex items-center justify-between gap-4 text-sm text-sand-600">
  <button type="button" (click)="anterior()" [disabled]="page() <= 1" class="btn-secondary px-3 py-1.5">
    ← Anterior
  </button>
  <span>Página <strong class="text-brand-800">{{ page() }}</strong> de {{ totalPaginas() }} ({{ total() }} en total)</span>
  <button
    type="button"
    (click)="siguiente()"
    [disabled]="page() >= totalPaginas()"
    class="btn-secondary px-3 py-1.5"
  >
    Siguiente →
  </button>
</div>
