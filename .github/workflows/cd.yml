name: CD

# Se dispara cuando el workflow "CI" TERMINA en main — no directamente en push,
# para no desplegar código que no pasó lint/build/test. Ver ci.yml.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

jobs:
  deploy-backend:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Calcular nombre de imagen (ghcr.io exige minúsculas)
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/caris-backend" >> "$GITHUB_ENV"

      # Necesario para el caché de capas (type=gha): el driver "docker" por
      # defecto no soporta exportar caché, buildx con driver docker-container sí.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}

      - name: Desplegar en la VM (pull + up + migraciones)
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
          ssh "$VM_USER@$VM_HOST" "cd /opt/caris && \
            sed -i 's#^BACKEND_IMAGE=.*#BACKEND_IMAGE=${{ env.IMAGE }}:${{ github.sha }}#' .env && \
            docker compose pull backend && \
            docker compose up -d backend && \
            docker compose exec -T backend ./node_modules/.bin/prisma migrate deploy"

  deploy-frontend:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Generar frontend/.env de producción
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          echo "API_BASE_URL=$API_BASE_URL" > .env
          echo "NODE_ENV=production" >> .env

      - run: pnpm build

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}

      - name: Copiar build estático a la VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
          rsync -az --delete dist/frontend/browser/ "$VM_USER@$VM_HOST:/var/www/caris/frontend/"
